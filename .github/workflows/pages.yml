# Veröffentlicht die App als GitHub Pages.
#
# GitHub hostet die Seite selbst -- kein FTP, keine Zugangsdaten, nichts von
# Hand hochzuladen. Das Repository bleibt privat, die Website ist öffentlich
# erreichbar; genau diese Kombination braucht eine App, die Patienten per
# QR-Code aufrufen, deren Quellcode aber dem Haus gehört.
#
# Einmalig einzustellen: Settings -> Pages -> Source: "GitHub Actions".
# Dafür wird ein bezahlter Plan benötigt, solange das Repository privat ist.

name: Als GitHub Pages veröffentlichen

# Laeuft bei jeder Aenderung am Entwicklungszweig. Voraussetzung ist, dass
# unter Settings -> Pages als Quelle "GitHub Actions" eingestellt ist; bei
# einem privaten Repository verlangt Pages zusaetzlich einen bezahlten Plan.
on:
  push:
    branches:
      # Nur main. Ein Arbeitszweig hat hier nichts verloren: der Ablauf
      # schiebt mit --force auf gh-pages, ein Versehen wuerde also die
      # veroeffentlichte App durch einen halbfertigen Stand ersetzen.
      - main
    paths-ignore:
      - "README.md"
      - "werkzeuge/**"
  workflow_dispatch:

permissions:
  # Geschrieben wird der Zweig gh-pages -- mehr wird nicht gebraucht.
  contents: write

# Läuft eine Veröffentlichung bereits, wird sie nicht abgebrochen -- eine
# halb übertragene Seite wäre schlimmer als eine kurze Wartezeit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Stand holen
        uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p _seite
          # Alles außer Werkzeugen, Abläufen und der Entwicklerdatei.
          rsync -a --exclude '.git' --exclude '.github' --exclude 'werkzeuge' \
                   --exclude 'README.md' --exclude '_seite' ./ _seite/
          # Ohne diese Datei überspringt GitHub Ordner, deren Name mit einem
          # Unterstrich beginnt. Wir haben keine -- aber das kann sich ändern.
          touch _seite/.nojekyll
          echo "Übertragen werden:"
          find _seite -type f | wc -l
          du -sh _seite

      - name: Ursprüngliche blaue Ausgabe mitliefern
        run: |
          # Unter /behandlungsplan_official bleibt die Fassung erreichbar, in
          # der die App im Haus vorgestellt wurde. Es ist dieselbe App, nur
          # mit den alten Markenfarben -- kein zweiter Programmstand, der
          # gepflegt werden müsste. Kopiert wird die fertige Seite, danach
          # gewinnt die angehängte Farbdatei über den Block in styles.css.
          ziel=_seite/behandlungsplan_official
          mkdir -p "$ziel"
          rsync -a --exclude 'behandlungsplan_official' _seite/ "$ziel/"
          cat farben/blau.css >> "$ziel/styles.css"
          # Farbe der Statusleiste am Telefon -- steht außerhalb von styles.css.
          sed -i 's/#871c31/#0e3a6b/g' "$ziel/index.html" "$ziel/rechtliches.html" "$ziel/manifest.webmanifest"
          sed -i 's/stroke="#5e1229"/stroke="#0a2547"/' "$ziel/index.html"
          # Der QR-Code führt bewusst weiter auf die Hauptadresse: wer die App
          # weitergibt, soll die aktuelle bekommen, nicht die aufbewahrte.
          echo "Zweitfassung unter /behandlungsplan_official:"
          du -sh "$ziel"

      - name: Vollständigkeit prüfen
        run: |
          # Fehlt die Texterkennung, startet die App beim Patienten nicht.
          # Lieber hier abbrechen als eine kaputte Seite veröffentlichen.
          for pflicht in index.html app.js parser.js ocr.js store.js styles.css \
                         tessdata/deu.traineddata.gz vendor/tesseract.min.js \
                         vendor/worker.min.js vendor/pdf.mjs; do
            if [ ! -s "_seite/$pflicht" ]; then
              echo "::error::$pflicht fehlt oder ist leer -- Veröffentlichung abgebrochen."
              exit 1
            fi
          done
          for pflicht in index.html styles.css tessdata/deu.traineddata.gz; do
            if [ ! -s "_seite/behandlungsplan_official/$pflicht" ]; then
              echo "::error::behandlungsplan_official/$pflicht fehlt -- Veröffentlichung abgebrochen."
              exit 1
            fi
          done
          if ! grep -q '0e3a6b' _seite/behandlungsplan_official/styles.css; then
            echo "::error::Die blaue Ausgabe trägt nicht die alten Farben -- Veröffentlichung abgebrochen."
            exit 1
          fi
          echo "Alle Pflichtdateien vorhanden, Zweitfassung eingefärbt."

      - name: Auf den Zweig gh-pages schieben
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Veroeffentlicht wird ueber den klassischen Zweig gh-pages, nicht
          # ueber die Pages-API. Grund: die API verlangt, dass unter
          # Settings -> Pages die Quelle "GitHub Actions" eingestellt ist --
          # ein Klick, an dem die Einrichtung mehrfach gescheitert ist, weil
          # der Ablauf ihn nicht selbst setzen darf. Ueber den Zweig kommt
          # die Veroeffentlichung ganz ohne Einstellung aus.
          cd _seite
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Stand ${GITHUB_SHA:0:7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Veroeffentlicht unter https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
